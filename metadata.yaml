name: astrbot_plugin_private_history
display_name: 私聊历史查询
short_desc: 让模型在私聊里查「和你这个人」聊过什么，群聊不受影响。
desc: >-
  AstrBot 本体只在群聊里落消息，也只给群聊提供历史查询工具。
  这个插件把同一套能力搬进私聊：自动记录你和机器人的私聊消息，
  并在私聊对话里给模型挂一个查询工具。模型可以按关键词、条数、起止时间
  查当前这个人的历史，读不到群聊、别人的私聊或其他会话。
  读写都走框架自己的平台消息历史接口，不直连数据库，也不改本体任何文件。
help: >-
  装好即生效。插件配置里可以开关、改默认条数、单条截断长度、返回总长度上限，
  以及每个私聊会话保留多少条。只记录安装之后的新消息，装之前的老聊天不在库里。
  机器人用指令回复（不经过模型）的内容不会记录；
  网页聊天有自己的记录方式，本插件不重复记，也不在网页聊天里提供这个工具。
version: 1.0.0
author: 大肥鱼、coalblock666710
repo: https://github.com/3303339695/astrbot_plugin_private_history
astrbot_version: ">=4.20.0"
tags:
